services:
  app:
    build: .
    image: petagenda-app
    ports:
      - "8000:8000"
    volumes:
      - ".:/var/www"
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: local
      APP_KEY: ""
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: petshop
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: petshop
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ".:/var/www"
      - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - app

volumes:
  dbdata:
